<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="The commitport app window: pick a project folder, click Generate portal, then open the result.">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  </defs>
  <rect width="900" height="600" rx="20" fill="#e9ecf4"/>
  <!-- window -->
  <rect x="70" y="46" width="760" height="508" rx="16" fill="#ffffff" stroke="#d9deea"/>
  <!-- titlebar -->
  <rect x="70" y="46" width="760" height="44" rx="16" fill="#eef0f6"/>
  <rect x="70" y="74" width="760" height="16" fill="#eef0f6"/>
  <circle cx="96" cy="68" r="6" fill="#ef5f57"/><circle cx="116" cy="68" r="6" fill="#f7bd4d"/><circle cx="136" cy="68" r="6" fill="#5fc55c"/>
  <text x="166" y="72" font-size="13" fill="#64748b">commitport</text>

  <!-- header -->
  <g transform="translate(110,118)">
    <rect width="34" height="34" rx="8" fill="url(#brand)"/>
    <g transform="translate(5.6,5.6) scale(0.087)" stroke="#fff" stroke-width="18" stroke-linecap="round" fill="#fff">
      <line x1="98" y1="72" x2="98" y2="184"/><line x1="98" y1="128" x2="168" y2="86"/>
      <circle cx="98" cy="72" r="19"/><circle cx="98" cy="184" r="19"/><circle cx="168" cy="86" r="21"/>
      <circle cx="98" cy="128" r="31"/>
    </g>
    <text x="46" y="23" font-size="17" font-weight="600" fill="#0f172a">commitport</text>
  </g>

  <text x="110" y="186" font-size="25" font-weight="600" fill="#0f172a" letter-spacing="-0.5">Turn your commits into a client portal</text>
  <text x="110" y="214" font-size="14.5" fill="#64748b">Point it at your project, click generate. Your clients get a clean, plain-English progress page.</text>

  <!-- card -->
  <rect x="110" y="238" width="680" height="262" rx="14" fill="#fbfcfe" stroke="#e6e8ee"/>

  <text x="132" y="272" font-size="13.5" font-weight="600" fill="#0f172a">Project folder</text>
  <rect x="132" y="284" width="500" height="40" rx="9" fill="#f4f6fb" stroke="#e1e5f0"/>
  <text x="148" y="309" font-size="13.5" fill="#0f172a">D:\WORK\acme-rebrand</text>
  <rect x="644" y="284" width="124" height="40" rx="9" fill="#fff" stroke="#dfe4ef"/>
  <text x="706" y="309" font-size="13.5" fill="#0f172a" text-anchor="middle">Browse…</text>
  <text x="132" y="345" font-size="12" fill="#64748b">The git repository with your commits.</text>

  <!-- generate button -->
  <rect x="132" y="360" width="636" height="46" rx="11" fill="url(#brand)"/>
  <text x="450" y="389" font-size="15.5" font-weight="600" fill="#fff" text-anchor="middle">Generate portal</text>

  <!-- success card -->
  <rect x="132" y="420" width="636" height="62" rx="11" fill="#ecfdf3" stroke="#9bdcb8"/>
  <text x="150" y="446" font-size="15" font-weight="600" fill="#065f3c">✓ Portal generated</text>
  <text x="150" y="467" font-size="12.5" fill="#3f7a5e">Published 2 updates · 1 internal commit kept private</text>
  <rect x="566" y="436" width="92" height="32" rx="8" fill="url(#brand)"/>
  <text x="612" y="457" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">Open portal</text>
  <rect x="666" y="436" width="86" height="32" rx="8" fill="#fff" stroke="#cdd4e0"/>
  <text x="709" y="457" font-size="12.5" fill="#0f172a" text-anchor="middle">Open folder</text>

  <text x="110" y="528" font-size="12.5" fill="#94a3b8" text-anchor="start">Runs entirely on your machine — nothing is uploaded. Requires git.</text>
</svg>
