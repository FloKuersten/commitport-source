<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- app tile -->
  <rect x="0" y="0" width="256" height="256" rx="60" fill="url(#bg)"/>
  <rect x="0" y="0" width="256" height="256" rx="60" fill="url(#sheen)"/>
  <!-- git graph: main branch + one branch, in white -->
  <g stroke="#ffffff" stroke-width="18" stroke-linecap="round" fill="#ffffff">
    <line x1="98" y1="72" x2="98" y2="184"/>
    <line x1="98" y1="128" x2="168" y2="86"/>
    <circle cx="98" cy="72" r="19"/>
    <circle cx="98" cy="184" r="19"/>
    <circle cx="168" cy="86" r="21"/>
  </g>
  <!-- central commit: white ring with an accent core (the "port") -->
  <circle cx="98" cy="128" r="31" fill="#ffffff"/>
  <circle cx="98" cy="128" r="13" fill="url(#bg)"/>
</svg>
